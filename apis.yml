apis:
  - aid: apog-enterprises:sec-edgar-filings
    name: SEC EDGAR Filings (Apogee Enterprises, CIK 6845)
    description: >-
      Machine-readable filing data for Apogee Enterprises is available from the U.S. Securities and
      Exchange Commission, not from the company. The SEC EDGAR submissions API returns the full filing
      history for CIK 0000006845 (ticker APOG, Nasdaq; SIC 3231 Glass Products, Made of Purchased
      Glass) as JSON. This is a third-party government API listed here because it is the only real
      programmatic access to this company's data.
    image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/icons/apog-enterprises.png
    humanURL: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
    baseURL: https://data.sec.gov
    tags:
      - Filings
      - SEC EDGAR
      - Third Party
    properties:
      - type: Documentation
        url: https://www.sec.gov/search-filings/edgar-application-programming-interfaces
      - type: APIReference
        url: https://data.sec.gov/submissions/CIK0000006845.json
    x-evidence:
      verified: '2026-09-18'
      method: fetched documentation and called the endpoint
      documentation: >-
        The SEC's EDGAR APIs page documents RESTful JSON APIs on data.sec.gov —
        https://data.sec.gov/submissions/CIK##########.json plus the XBRL companyconcept,
        companyfacts and frames APIs. No authentication or API key required; a declared User-Agent
        and a 10-request-per-second ceiling are the stated fair-access terms.
      endpoint_check: >-
        GET https://data.sec.gov/submissions/CIK0000006845.json returned HTTP 200 with JSON naming
        "APOGEE ENTERPRISES, INC.", ticker APOG on Nasdaq, state of incorporation MN, and a most
        recent filing (Form 4) dated 2026-09-15.
