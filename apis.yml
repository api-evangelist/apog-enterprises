description: >-
  Apogee Enterprises (Nasdaq: APOG), founded in 1949 as the Harmon Glass Company and headquartered
  in Minneapolis, Minnesota, is an architectural products and services company. Its operating
  brands make high-performance architectural glass (Viracon), aluminum framing, storefront,
  curtainwall and entrance systems (Apogee Architectural Metals — the former EFCO and Tubelite —
  and Alumicor, with Linetec finishing), install glass and metal facades on large commercial
  buildings (Harmon) and produce large-scale optical glass and acrylic for framing and displays
  (Tru Vue, UW Solutions). Apogee does not publish a public developer API, SDK, webhook or
  developer portal. Its external digital surface is an Akamai-fronted investor-relations website at
  apog.com serving HTML and PDF, plus supplier onboarding on Coupa's Supplier Portal; the
  "EDI/API/Integration contact" named there is a Coupa user role, not an Apogee API. The hosts
  api.apog.com and developer.apog.com listed by an earlier stub do not exist in DNS. Machine-readable
  company data is available only through third-party channels, namely the SEC's EDGAR APIs.
