description: >-
  Apogee Enterprises (Nasdaq: APOG) is an architectural products company — high-performance
  architectural glass (Viracon), aluminum framing, storefront and entrance systems (Apogee
  Architectural Metals, formerly EFCO and Tubelite; Alumicor; Linetec finishing), installation
  services (Harmon) and large-scale optical glass and acrylic (Tru Vue, UW Solutions). It publishes
  no developer API, no API plans and no API pricing page. Its only public web surface is an
  investor-relations site; its supplier onboarding runs on Coupa's Supplier Portal, where the
  "EDI/API/Integration contact" is a Coupa user role, not an Apogee API.
notes: >-
  No public API plans or pricing exist. plan_count is 0 on purpose. The 2026-05-04 sweep had
  padded this file with a placeholder "Partner / Custom Integration" plan; that row was
  invented and was removed on 2026-09-18 — nothing on the provider's surface describes any
  partner API contract.
